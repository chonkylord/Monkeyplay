appId: play.monkey.launcher
productName: MonkeyPlay
icon: build/icon.ico
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: ../companion-mod/build/libs
    to: companion-mod
    filter:
      - "*.jar"
  - from: build/icon.png
    to: icon.png
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
    - deb
publish:
  provider: generic
  url: https://updates.monkeyplay.local/
